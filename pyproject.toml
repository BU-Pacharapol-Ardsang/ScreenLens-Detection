[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screenlens-detection"
version = "0.1.0"
description = "Realtime screen-text detection desktop app built with Python, Qt, and OpenCV."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "deep-translator>=1.11.4",
  "mss>=10.0.0",
  "numpy>=2.1.0",
  "opencv-python>=4.10.0.84",
  "Pillow>=10.4.0",
  "PySide6>=6.8.0",
  "pytesseract>=0.3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
screenlens = "screenlens_detection.main:main"
screenlens-detection = "screenlens_detection.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
